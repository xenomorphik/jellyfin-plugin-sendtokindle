<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Send to Kindle Configuration</title>
</head>
<body>
    <div id="SendToKindleConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h1>Send to Kindle</h1>
                <form class="SendToKindleConfigForm">
                    
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SmtpServer">SMTP Server</label>
                        <input type="text" id="SmtpServer" name="SmtpServer" is="emby-input" required />
                        <div class="fieldDescription">Example: smtp.gmail.com</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SmtpPort">SMTP Port</label>
                        <input type="number" id="SmtpPort" name="SmtpPort" is="emby-input" required />
                        <div class="fieldDescription">Usually 587 or 465</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SmtpUsername">SMTP Username</label>
                        <input type="text" id="SmtpUsername" name="SmtpUsername" is="emby-input" required />
                        <div class="fieldDescription">Your email address</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="SmtpPassword">SMTP Password</label>
                        <input type="password" id="SmtpPassword" name="SmtpPassword" is="emby-input" required />
                        <div class="fieldDescription">App password if using 2FA</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TargetKindleEmail">Target Kindle Email</label>
                        <input type="email" id="TargetKindleEmail" name="TargetKindleEmail" is="emby-input" required />
                        <div class="fieldDescription">Your @kindle.com email address</div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var SendToKindleConfig = {
                pluginUniqueId: 'f6e80b43-9876-47b2-bd88-abcdef123456'
            };

            document.querySelector('#SendToKindleConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(SendToKindleConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#SmtpServer').value = config.SmtpServer || '';
                    document.querySelector('#SmtpPort').value = config.SmtpPort || '587';
                    document.querySelector('#SmtpUsername').value = config.SmtpUsername || '';
                    document.querySelector('#SmtpPassword').value = config.SmtpPassword || '';
                    document.querySelector('#TargetKindleEmail').value = config.TargetKindleEmail || '';
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('.SendToKindleConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                
                ApiClient.getPluginConfiguration(SendToKindleConfig.pluginUniqueId).then(function (config) {
                    config.SmtpServer = document.querySelector('#SmtpServer').value;
                    config.SmtpPort = parseInt(document.querySelector('#SmtpPort').value, 10);
                    config.SmtpUsername = document.querySelector('#SmtpUsername').value;
                    config.SmtpPassword = document.querySelector('#SmtpPassword').value;
                    config.TargetKindleEmail = document.querySelector('#TargetKindleEmail').value;

                    ApiClient.updatePluginConfiguration(SendToKindleConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
