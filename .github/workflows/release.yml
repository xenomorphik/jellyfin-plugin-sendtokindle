name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.SendToKindle/Jellyfin.Plugin.SendToKindle.csproj -c Release -o out

      - name: Zip plugin
        run: |
          cd out
          rm -f Jellyfin.*.dll MediaBrowser.*.dll Emby.*.dll Microsoft.Extensions.*.dll ICU4N*.dll Diacritics.dll J2N.dll
          rm -f ../SendToKindle.zip
          zip -r ../SendToKindle.zip ./**
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SendToKindle.zip
          generate_release_notes: true
          
      - name: Update manifest.json
        run: |
          CHECKSUM=$(md5sum SendToKindle.zip | awk '{print $1}')
          python3 .github/scripts/update_manifest.py manifest.json ${{ github.ref_name }} $CHECKSUM
          
      - name: Commit and push manifest
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git checkout main
          git add manifest.json
          git commit -m "chore: update manifest.json for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin main
